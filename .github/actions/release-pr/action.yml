name: Release PR
description: Update images in the release repo and open a PR

inputs:
  token:
    required: true
  app_slug:
    required: true
  release_repo:
    required: true
  service_dir:
    required: true
  environment:
    required: true
  images:
    required: true
  title:
    required: true
  body:
    required: false
    default: ""
  auto_merge:
    required: false
    default: "false"
outputs:
  pr_url:
    value: ${{ steps.pr.outputs.pr_url }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.release_repo }}
        token: ${{ inputs.token }}
        path: .release-repo

    - id: pr
      shell: bash
      working-directory: .release-repo
      env:
        GH_TOKEN: ${{ inputs.token }}
        BOT: ${{ inputs.app_slug }}[bot]
        RELEASE_REPO: ${{ inputs.release_repo }}
        SERVICE_DIR: ${{ inputs.service_dir }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGES: ${{ inputs.images }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        AUTO_MERGE: ${{ inputs.auto_merge }}
      run: |
        set -euo pipefail
        mapfile -t images < <(printf '%s\n' "$IMAGES" | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//')
        scripts/set-image.sh "${SERVICE_DIR}/${ENVIRONMENT}" "${images[@]}"
        if git diff --quiet; then
          echo "${ENVIRONMENT}: already up to date"
          echo "pr_url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        branch="release/${SERVICE_DIR}/${ENVIRONMENT}/${images[0]##*:}"
        git config user.name "$BOT"
        git config user.email "${BOT}@users.noreply.github.com"
        git checkout -b "$branch"
        git commit -am "$TITLE"
        git push -u origin "$branch"
        url=$(gh pr create --base main --head "$branch" --title "$TITLE" --body "$BODY")
        num="${url##*/}"
        echo "pr_url=${url}" >> "$GITHUB_OUTPUT"
        echo "PR: ${url}"
        echo "- ${ENVIRONMENT}: ${url}" >> "$GITHUB_STEP_SUMMARY"

        [ "$AUTO_MERGE" = "true" ] || exit 0
        gh pr merge "$num" --squash --auto --delete-branch || gh pr merge "$num" --squash --delete-branch

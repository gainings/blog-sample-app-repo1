name: Release PR
description: |
  リリースリポジトリの services/<service>/<env>/.env にあるイメージを更新する PR を作る。
  auto_merge=true なら auto-merge する (リポジトリで auto-merge が無効なら即マージ)。

inputs:
  token:
    description: リリースリポジトリに対する contents / pull_requests write 権限を持つ GitHub App トークン
    required: true
  app_slug:
    description: GitHub App の slug (コミットの author に使う)
    required: true
  release_repo:
    description: owner/name
    required: true
  service:
    required: true
  environment:
    required: true
  images:
    description: 1 行 1 イメージ (registry/repository:tag)
    required: true
  title:
    required: true
  body:
    required: false
    default: ""
  auto_merge:
    required: false
    default: "false"
outputs:
  pr_url:
    description: 作成した PR の URL (変更がなければ空)
    value: ${{ steps.pr.outputs.pr_url }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.release_repo }}
        token: ${{ inputs.token }}
        path: .release-repo

    - id: pr
      shell: bash
      working-directory: .release-repo
      env:
        GH_TOKEN: ${{ inputs.token }}
        BOT: ${{ inputs.app_slug }}[bot]
        RELEASE_REPO: ${{ inputs.release_repo }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGES: ${{ inputs.images }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        AUTO_MERGE: ${{ inputs.auto_merge }}
      run: |
        set -euo pipefail
        mapfile -t images < <(printf '%s\n' "$IMAGES" | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//')
        scripts/set-image.sh "$SERVICE" "$ENVIRONMENT" "${images[@]}"
        if git diff --quiet; then
          echo "${ENVIRONMENT}: already up to date"
          echo "pr_url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        branch="release/${SERVICE}/${ENVIRONMENT}/${images[0]##*:}"
        git config user.name "$BOT"
        git config user.email "${BOT}@users.noreply.github.com"
        git checkout -b "$branch"
        git commit -am "$TITLE"
        git push -u origin "$branch"
        url=$(gh pr create --base main --head "$branch" --title "$TITLE" --body "$BODY")
        num="${url##*/}"
        echo "pr_url=${url}" >> "$GITHUB_OUTPUT"
        echo "PR: ${url}"
        echo "- ${ENVIRONMENT}: ${url}" >> "$GITHUB_STEP_SUMMARY"

        [ "$AUTO_MERGE" = "true" ] || exit 0
        # Allow auto-merge が有効なら CI 通過後にマージ、無効なら即マージ
        gh pr merge "$num" --squash --auto --delete-branch || gh pr merge "$num" --squash --delete-branch

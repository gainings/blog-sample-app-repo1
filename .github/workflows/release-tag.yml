name: Release tag

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REPO_NAME: blog-sample-release-repo
  SERVICE_DIR: ecs/blog-sample-app
  SERVICE_NAME: blog-sample-app

jobs:
  tag-release-image:
    name: tag images as ${{ github.ref_name }}
    if: vars.AWS_BUILD_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Add release tag to images
        env:
          REPOS: ${{ vars.ECR_REPOSITORY }} ${{ vars.ECR_REPOSITORY }}-nginx
          SRC_TAG: sha-${{ github.sha }}
          DST_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for repo in $REPOS; do
            manifest=$(aws ecr batch-get-image --repository-name "$repo" \
              --image-ids imageTag="$SRC_TAG" --query 'images[0].imageManifest' --output text)
            if [ -z "$manifest" ] || [ "$manifest" = "None" ]; then
              echo "::error::image ${repo}:${SRC_TAG} not found in ECR"; exit 1
            fi
            aws ecr put-image --repository-name "$repo" --image-tag "$DST_TAG" --image-manifest "$manifest"
            echo "tagged ${repo}:${SRC_TAG} as ${DST_TAG}"
          done

  release-stg:
    name: release to stg
    needs: tag-release-image
    if: ${{ !cancelled() && needs.tag-release-image.result != 'failure' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RELEASE_REPO_NAME }}
      - uses: ./.github/actions/release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
          release_repo: ${{ github.repository_owner }}/${{ env.RELEASE_REPO_NAME }}
          service_dir: ${{ env.SERVICE_DIR }}
          environment: stg
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}-nginx:${{ github.ref_name }}
          title: "Release ${{ env.SERVICE_NAME }} ${{ github.ref_name }} to stg"
          body: "Release notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          auto_merge: "true"

  release-prd:
    name: propose release to prd
    needs: tag-release-image
    if: ${{ !cancelled() && needs.tag-release-image.result != 'failure' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RELEASE_REPO_NAME }}
      - uses: ./.github/actions/release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
          release_repo: ${{ github.repository_owner }}/${{ env.RELEASE_REPO_NAME }}
          service_dir: ${{ env.SERVICE_DIR }}
          environment: prd
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}-nginx:${{ github.ref_name }}
          title: "Release ${{ env.SERVICE_NAME }} ${{ github.ref_name }} to prd"
          body: "Release notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}\n\nMerging this PR deploys ${{ github.ref_name }} to prd."
          auto_merge: "false"

name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  RELEASE_REPO_NAME: blog-sample-release-repo
  SERVICE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

      - id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_BUILD_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: vars.AWS_BUILD_ROLE_ARN != ''

      - uses: docker/setup-buildx-action@v3

      - name: Build & push (app)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ vars.AWS_BUILD_ROLE_ARN != '' }}
          platforms: linux/amd64
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build & push (nginx sidecar)
        uses: docker/build-push-action@v6
        with:
          context: nginx
          push: ${{ vars.AWS_BUILD_ROLE_ARN != '' }}
          platforms: linux/amd64
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}-nginx:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - if: vars.AWS_BUILD_ROLE_ARN == ''
        run: echo "::warning::AWS_BUILD_ROLE_ARN is not set. Images ${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} and ${{ vars.ECR_REPOSITORY }}-nginx:${{ steps.meta.outputs.image_tag }} were built but NOT pushed."

  release-dev:
    name: release to dev
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RELEASE_REPO_NAME }}
      - uses: ./.github/actions/release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
          release_repo: ${{ github.repository_owner }}/${{ env.RELEASE_REPO_NAME }}
          service: ${{ env.SERVICE_NAME }}
          environment: dev
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}-nginx:${{ needs.build.outputs.image_tag }}
          title: "Release ${{ env.SERVICE_NAME }} ${{ needs.build.outputs.image_tag }} to dev"
          body: "Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          auto_merge: "true"

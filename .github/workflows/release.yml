# main へのマージを起点にしたリリースパイプライン (アプリ側)。
#
#   build ──> release-dev-stg : リリースリポジトリの dev/ stg/ の image を更新する PR (auto-merge)
#
# - このリポジトリはイメージのビルドだけを担当する。デプロイ定義と実行は blog-sample-release-repo にあり、
#   そこの main に入ったものがリリースされる
# - バージョニング (tagpr) と prd 用の PR は tagpr.yml が担当する。tagpr.yml はこのワークフローの成功後に動く
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  RELEASE_REPO_NAME: blog-sample-release-repo
  # リリースリポジトリ側の services/<SERVICE_NAME>/ に対応する
  SERVICE_NAME: blog-sample-app

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

      - id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # AWS_BUILD_ROLE_ARN が未設定なら AWS には接続せず、ビルドだけして push を省略する (フローの確認用)
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_BUILD_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: vars.AWS_BUILD_ROLE_ARN != ''

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ vars.AWS_BUILD_ROLE_ARN != '' }}
          platforms: linux/amd64
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: vars.AWS_BUILD_ROLE_ARN == ''
        run: echo "::warning::AWS_BUILD_ROLE_ARN is not set. Image ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} was built but NOT pushed."

  release-dev-stg:
    # dev / stg の image を更新する PR をリリースリポジトリに作り、auto-merge する
    name: release to dev, stg
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RELEASE_REPO_NAME }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.RELEASE_REPO_NAME }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Update image and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          for env in dev stg; do scripts/set-image.sh "$SERVICE_NAME" "$env" "$IMAGE"; done
          if git diff --quiet; then echo "dev / stg already at $IMAGE"; exit 0; fi

          branch="release/${SERVICE_NAME}/${IMAGE_TAG}"
          git config user.name "$BOT"
          git config user.email "${BOT}@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Release ${SERVICE_NAME} ${IMAGE_TAG} to dev, stg"
          git push -u origin "$branch"
          body=$(printf 'Image: `%s`\nSource: %s\n\nAuto-merged by the Release workflow of %s.' "$IMAGE" "$SOURCE" "$GITHUB_REPOSITORY")
          gh pr create --base main --head "$branch" \
            --title "Release ${SERVICE_NAME} ${IMAGE_TAG} to dev, stg" --body "$body"
          # Allow auto-merge が有効なら CI 通過後にマージ、無効なら即マージ
          gh pr merge "$branch" --squash --auto --delete-branch \
            || gh pr merge "$branch" --squash --delete-branch

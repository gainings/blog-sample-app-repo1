# tagpr によるリリース PR の管理と、タグが切られた時の stg / prd リリース。
#
#   tagpr ──(タグが切られた時だけ)──> tag-release-image ──> release-stg ──> release-prd
#                                                          (auto-merge,     (PR を作るだけ。
#                                                           適用成功を待つ)   マージは人 = 本番リリース)
#
# - Release (build → dev) が成功した後に workflow_run で動く。ビルドが通っていないコミットにはタグを付けない
# - 通常のマージ:        リリース PR (VERSION と CHANGELOG の更新) を作成/更新して終わる
# - リリース PR のマージ: タグ (CalVer) と GitHub Release を作り、ECR のイメージに同じタグを付け、
#                        stg を自動で更新し、prd を更新する PR を作る。その PR のマージが本番リリース
name: Tagpr

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: tagpr-main
  cancel-in-progress: false

env:
  RELEASE_REPO_NAME: blog-sample-release-repo
  # リリースリポジトリ側の services/<SERVICE_NAME>/ に対応する
  SERVICE_NAME: blog-sample-app

jobs:
  tagpr:
    name: tagpr
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # GITHUB_TOKEN で作った PR には CI が走らないため、GitHub App のトークンを使う
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Ensure main is still the built commit
        id: head
        env:
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$BUILT" ]; then
            echo "::notice::main moved on (${sha:0:7}) since the built commit (${BUILT:0:7}); the next Release run will handle it"
            exit 1
          fi
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  tag-release-image:
    # リリース対象のイメージに CalVer タグ (vYYYY.MMDD.N) も付ける (prd はこのタグを参照する)
    name: tag image as ${{ needs.tagpr.outputs.tag }}
    needs: tagpr
    # AWS_BUILD_ROLE_ARN が未設定 (AWS なしでフローを確認している) ならスキップ
    if: needs.tagpr.outputs.tag != '' && vars.AWS_BUILD_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Add release tag to images
        env:
          REPOS: ${{ vars.ECR_REPOSITORY }} ${{ vars.ECR_REPOSITORY }}-nginx
          SRC_TAG: sha-${{ needs.tagpr.outputs.sha }}
          DST_TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          set -euo pipefail
          for repo in $REPOS; do
            manifest=$(aws ecr batch-get-image --repository-name "$repo" \
              --image-ids imageTag="$SRC_TAG" --query 'images[0].imageManifest' --output text)
            if [ -z "$manifest" ] || [ "$manifest" = "None" ]; then
              echo "::error::image ${repo}:${SRC_TAG} not found in ECR"; exit 1
            fi
            aws ecr put-image --repository-name "$repo" --image-tag "$DST_TAG" --image-manifest "$manifest"
            echo "tagged ${repo}:${SRC_TAG} as ${DST_TAG}"
          done

  release-stg:
    # stg の .env をそのタグに更新する PR を作り、auto-merge し、リリース側の Release 実行が成功するまで待つ
    name: release to stg (${{ needs.tagpr.outputs.tag }})
    needs: [tagpr, tag-release-image]
    if: ${{ !cancelled() && needs.tagpr.result == 'success' && needs.tagpr.outputs.tag != '' && needs.tag-release-image.result != 'failure' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RELEASE_REPO_NAME }}
      - uses: ./.github/actions/release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
          release_repo: ${{ github.repository_owner }}/${{ env.RELEASE_REPO_NAME }}
          service: ${{ env.SERVICE_NAME }}
          environment: stg
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.tagpr.outputs.tag }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}-nginx:${{ needs.tagpr.outputs.tag }}
          title: "Release ${{ env.SERVICE_NAME }} ${{ needs.tagpr.outputs.tag }} to stg"
          body: "Release notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.tagpr.outputs.tag }}"
          auto_merge: "true"
          wait_for_release: "true"

  release-prd:
    # stg が適用できたら、prd の .env をそのタグに更新する PR を作る。マージは人が行う (= 本番リリース)
    name: propose release to prd (${{ needs.tagpr.outputs.tag }})
    needs: [tagpr, release-stg]
    if: ${{ !cancelled() && needs.release-stg.result == 'success' && needs.tagpr.outputs.tag != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.RELEASE_REPO_NAME }}
      - uses: ./.github/actions/release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
          release_repo: ${{ github.repository_owner }}/${{ env.RELEASE_REPO_NAME }}
          service: ${{ env.SERVICE_NAME }}
          environment: prd
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ needs.tagpr.outputs.tag }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}-nginx:${{ needs.tagpr.outputs.tag }}
          title: "Release ${{ env.SERVICE_NAME }} ${{ needs.tagpr.outputs.tag }} to prd"
          body: "Release notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.tagpr.outputs.tag }}\n\nMerging this PR deploys ${{ needs.tagpr.outputs.tag }} to prd."
          auto_merge: "false"

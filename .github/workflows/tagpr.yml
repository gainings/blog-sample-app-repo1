name: Tagpr

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: tagpr-main
  cancel-in-progress: false

jobs:
  tagpr:
    name: tagpr
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Ensure main is still the built commit
        id: head
        env:
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$BUILT" ]; then
            echo "::notice::main moved on (${sha:0:7}) since the built commit (${BUILT:0:7}); the next Release run will handle it"
            exit 1
          fi
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

name: Check GitHub App

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            blog-sample-release-repo
      - name: List accessible repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          echo "app: ${SLUG}"
          gh api /installation/repositories --jq '.repositories[].full_name' | tee repos.txt
          for r in "${{ github.repository }}" "${{ github.repository_owner }}/blog-sample-release-repo"; do
            grep -qx "$r" repos.txt || { echo "::error::App is not installed on $r"; exit 1; }
          done
          echo "permissions:"; gh api /installation/repositories --jq '.repositories[0].permissions'
          echo "OK: installed on both repositories"
